<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>난수를 발생시켜 맞추는 게임</title>
  </head>
  <body>
    <script>
      let low = 0; // 범위의 최솟값
      let high = 0; // 범위의 최댓값
      let card = 0; // 정답
      // 게임의 정답을 맞추기 위해서 무한루프를 돌고 있다.
      while (true) {
        let count = 0; // 시도 횟수
        low = 0;
        high = 99;
        // Math.floor() 함수는 소수점 이하를 버리는 함수입니다. Math.random() 함수는 0 이상 1 미만의 난수를 반환하는 함수입니다. 따라서 Math.random() * 100은 0 이상 100 미만의 난수를 생성합니다. Math.floor(Math.random() * 100)은 0부터 99까지의 정수 난수를 생성합니다.
        card = Math.floor(Math.random() * 100); // 0부터 99까지
        alert('0부터 99까지의 숫자 중 하나가 선택되었습니다. 맞춰보세요!');

        // 내부 루프는 사용자가 정답을 맞출 때까지 계속됩니다.
        while (true) {
          let n = 0;
          alert(low + ' ~ ' + high); // 현재 범위를 사용자에게 알려줍니다.
          count++; // 시도 횟수를 증가시킵니다.
          let input = window.prompt('숫자를 입력하세요.'); // 사용자로부터 숫자를 입력받습니다.
          if (input === null) {
            alert('게임을 종료합니다.');
            break;
          }
          n = parseInt(input);
          if (isNaN(n)) {
            alert('숫자를 입력하세요.');
            continue;
          }

          if (n > high || n < low) {
            alert('범위를 벗어난 숫자입니다. 다시 입력하세요.');
          } else if (n > card) {
            alert('정답보다 큽니다.');
            high = n - 1; // 정답보다 큰 숫자는 범위에서 제외합니다.
          } else if (n < card) {
            alert('정답보다 작습니다.');
            low = n + 1; // 정답보다 작은 숫자는 범위에서 제외합니다.
          } else {
            alert('정답입니다! 시도 횟수: ' + count);
            break; // 정답을 맞추면 내부 루프를 종료합니다.
          }

          alert('시도 횟수: ' + count); // 시도 횟수를 사용자에게 알려줍니다.
          const confirm = window.confirm('게임을 계속하시겠습니까?'); // 게임을 계속할지 사용자에게 묻습니다.
          if (!confirm) {
            break; // 사용자가 게임을 계속하지 않겠다고 선택하면 내부 루프를 종료합니다.
          }
        }
      }
    </script>
  </body>
</html>
