<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조건문(Switch)</title>
  </head>
  <body>
    <script>
      const rank = window.prompt(
        '직급을 입력하세요. 1: 사장, 2: 부장, 3: 과장',
      );
      switch (rank) {
        case '1':
          document.write('<p>사장입니다.</p>');
          break;
        case '2':
          document.write('부장입니다.');
          break;
        case '3':
          document.write('과장입니다.');
          break;
        default:
          document.write('알 수 없는 직급입니다.');
      }
    </script>
  </body>
</html>
