<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조건문-1</title>
  </head>
  <body>
    <script>
      // 사용자로부터 값을 입력
      const userId = window.prompt('아이디를 입력하세요.');
      // 값 비교하기 위한 코드
      if (userId == 'admin') {
        alert('관리자입니다.');
      } else {
        alert('관리자가 아닙니다.');
      }
    </script>
  </body>
</html>
