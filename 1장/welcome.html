<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      body {
        font-size: 1.3em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>안녕하세요</h1>
    <p id="result"></p>
    <script>
      // prompt() - 사용자로부터 이름을 입력받음
      const name = prompt('이름을 입력하세요:');
      // querySelector()로 id가 result인 요소를 선택하고 innerHTML로 내용을 출력
      document.querySelector('#result').innerHTML =
        `<b>환영합니다, ${name}</b>님!, 환영합니다.`;
    </script>
  </body>
</html>
