<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery로 이미지 움직이기</title>
    <link rel="stylesheet" href="css/pinggu.css" />
    <!-- jQuery 라이브러리를 CDN에서 불러옵니다. -->
    <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
    <!-- 로컬에 저장된 jQuery 라이브러리를 불러옵니다. -->
    <script src="lib/jquery-4.0.0.min.js"></script>
    <script src="js/pinggu.js"></script>
  </head>
  <body>
    <div id="panel">
      <div id="bar"></div>
      <!-- alt 속성은 이미지가 로드되지 않을 때 표시되는 텍스트입니다. -->
      <img id="pingGu" src="img/img.png" alt="pingGu" />
    </div>
    <div id="btn">
      <button id="btnStart">핑구 움직이기</button>
    </div>
  </body>
</html>
