<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>핑구, 텍스트 흔들기</title>
    <script src="lib/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="css/text.css" />
    <script>
      function hello() {
        // Math.floor(Math.random() * 20)는 0부터 19까지의 랜덤한 정수를 생성합니다.
        var random = Math.floor(Math.random() * 20);
        var random1 = Math.floor(Math.random() * 40);
        var random2 = Math.floor(Math.random() * 3) + 100;

        // .hello 요소의 CSS 속성을 변경하여 텍스트를 흔들리게 합니다.
        $('.hello').css({
          bottom: random,
          left: random1,
        });
        // 배경 확대
        $('.hello').css({
          'background-size': random2 + '%',
        });
      }
      setInterval(hello, 100); // 100ms마다 hello 함수를 실행하여 텍스트를 흔들리게 합니다.
    </script>
  </head>
  <body>
    <div class="hello">
      <div class="text">안녕하세요 강민찬입니다.</div>
    </div>
  </body>
</html>
