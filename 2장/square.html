<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사각형의 넓이 계산</title>
  </head>
  <body>
    <script>
      const width = prompt('사각형의 너비를 입력하세요:', '너비'); // 사용자로부터 사각형의 너비를 입력받는 프롬프트 창을 띄우고, 입력된 값을
      const height = prompt('사각형의 높이를 입력하세요:', '높이'); // 사용자로부터 사각형의 높이를 입력받는 프롬프트 창을 띄우고, 입력된 값을 변수에 저장
      const area = width * height; // 사각형의 넓이를 계산하기 위해 너비와 높이를 곱하여 area 변수에 저장
      alert('사각형의 넓이는 ' + area + '입니다.'); // 계산된 사각형의 넓이를 알림창으로 표시
    </script>
  </body>
</html>
