<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>숫자 입력</title>
  </head>
  <body>
    <script>
      // prompt 함수는 사용자로부터 입력을 받을 때 사용되는 함수입니다. 첫 번째 매개변수는 입력창에 표시될 메시지이고, 두 번째 매개변수는 입력창에 기본적으로 표시될 값입니다. 전부 문자열로 반환됩니다.
      let input = prompt('숫자를 입력하세요:', '숫자');
      alert(typeof input); // 입력된 값의 타입을 확인 (문자열)

      let num = Number(input); // 입력된 문자열을 숫자로 변환
      alert(typeof num); // 변환된 값의 타입을 확인 (숫자)
      // prompt에 문자열 입력 시 NaN(Not a Number)으로 변환되어 숫자로 사용할 수 없게 됩니다.
      alert(num);
    </script>
  </body>
</html>
